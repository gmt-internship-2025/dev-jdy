<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Gaze Web Click</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg1:#0f1020;
      --bg2:#1a1b2e;
      --card:#0f172a88;          /* glass */
      --stroke:#2b2e4a88;
      --text:#e5e7eb;
      --muted:#a1a1aa;
      --accent:#60a5fa;          /* 버튼 기본 포커스 */
      --accent2:#a78bfa;         /* 하이라이트 */
      --danger:#ef4444;          /* 포인터 */
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 16px;
      /* conf.py에서 설정된 논리 해상도를 사용하도록 변수 주입 */
      --w: {{ logical_w }};
      --h: {{ logical_h }};
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--text);
      background:
        radial-gradient(1200px 800px at 20% 10%, #1f2250 0%, transparent 70%),
        radial-gradient(1200px 800px at 80% 90%, #0f3a5a 0%, transparent 70%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      display:flex; align-items:center; justify-content:center;
      font-family: ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Pretendard,Apple SD Gothic Neo,Noto Sans KR,Arial,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol";
      overflow:hidden;
    }

    .wrap{
      width:min(95vw, 1900px);
      aspect-ratio: calc(var(--w) / var(--h));
      position:relative;
      border-radius: 22px;
      padding:18px;
      backdrop-filter: blur(6px);
      box-shadow: var(--shadow);
      background: linear-gradient(180deg, #ffffff08, #00000020);
      border:1px solid #ffffff22;
    }

    /* 카메라 대응 영역(논리 해상도와 비례 유지) */
    #camera-area{
      position:relative;
      width:100%;
      height:100%;
      border-radius: 18px;
      overflow:hidden;
      background:
        linear-gradient(135deg, #0b1224 0%, #0b122410 50%, #0b122400 100%),
        repeating-linear-gradient(0deg, #ffffff06 0 1px, transparent 1px 40px),
        repeating-linear-gradient(90deg, #ffffff06 0 1px, transparent 1px 40px),
        #0b1224;
      outline: 1px solid #ffffff14;
    }

    /* 버튼(타겟) – glass 카드 + hover lift + focus glow */
    .target{
      position:absolute;
      width: 420px;      /* 보기 좋게 조정 */
      height: 220px;
      border-radius: var(--radius);
      padding:18px;
      display:flex; align-items:center; justify-content:center;
      font-size: 28px; font-weight: 800; letter-spacing:.2px;
      color: var(--text);
      background:
        linear-gradient(180deg, #ffffff22, #ffffff08);
      border:1px solid #ffffff33;
      box-shadow: 0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      cursor: none; /* 커서 숨김(시선용 UI) */
      isolation:isolate;
    }
    .target:hover{ transform: translateY(-2px); }
    .target[data-active="true"]{
      box-shadow:
        0 8px 28px rgba(0,0,0,.5),
        0 0 0 2px #60a5fa55,
        0 0 40px 4px #60a5fa33;
      border-color:#60a5faaa;
    }

    /* 진행 링(머무름 시각화) – conic-gradient */
    .target::after{
      content:"";
      position:absolute; inset:-3px;
      border-radius: inherit;
      background:
        conic-gradient(var(--accent) calc(var(--p,0) * 360deg), transparent 0deg);
      -webkit-mask:
        radial-gradient(transparent 0  calc(100% - 10px),
                        #000  calc(100% - 9px) 100%);
      mask:
        radial-gradient(transparent 0  calc(100% - 10px),
                        #000  calc(100% - 9px) 100%);
      opacity: .85;
      pointer-events:none;
      filter: drop-shadow(0 0 10px #60a5fa66);
      transition: opacity .15s ease;
      mix-blend-mode:screen;
    }
    .target[data-active="false"]::after{ opacity:.12; }

    /* 포인터(인디케이터) – 펄스 링 + 그림자 */
    #indicator{
      position:absolute;
      width: 18px; height:18px;
      transform: translate(-50%,-50%);
      pointer-events:none;
      z-index: 3;
    }
    .dot{
      position:absolute; inset:0; border-radius:50%;
      background: radial-gradient(circle at 30% 30%, #fff, #ddd 40%, #ff5b5b 41%, #680f0f 100%);
      box-shadow: 0 6px 18px rgba(239,68,68,.55);
    }
    .ring{
      position:absolute; inset:-10px; border-radius:50%;
      border:2px solid #ff8c8c66;
      animation: pulse 1.2s ease-out infinite;
    }
    @keyframes pulse{
      0%{ transform:scale(.7); opacity: .9 }
      70%{ transform:scale(1.25); opacity: .1 }
      100%{ transform:scale(1.35); opacity: 0 }
    }

    /* 안내 배지 */
    .badge{
      position:absolute; right:18px; top:18px;
      background:#ffffff14; color:#e5e7eb; border:1px solid #ffffff22;
      border-radius:999px; padding:8px 14px; font-size:12px; letter-spacing:.3px;
      backdrop-filter: blur(6px);
    }

    /* 레이아웃 위치 (모서리 4곳) */
    #btn1{ top: 40px; left: 40px; }
    #btn2{ top: 40px; right: 40px; }
    #btn3{ bottom: 40px; left: 40px; }
    #btn4{ bottom: 40px; right: 40px; }

    /* 반응형: 화면이 작은 경우 버튼 축소 */
    @media (max-width: 1200px){
      .target{ width: 320px; height: 180px; font-size:22px; }
    }
    @media (max-width: 900px){
      .target{ width: 260px; height: 150px; font-size:20px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge">Gaze mode • dwell to click</div>
    <div id="camera-area" data-w="{{ logical_w }}" data-h="{{ logical_h }}">
      <div class="target" id="btn1">Button 1</div>
      <div class="target" id="btn2">Button 2</div>
      <div class="target" id="btn3">Button 3</div>
      <div class="target" id="btn4">Button 4</div>

      <div id="indicator">
        <div class="dot"></div>
        <div class="ring"></div>
      </div>
    </div>
  </div>
  
  <script>
    // ===== 설정 (Flask 서버로부터 값을 받아옴) =====
    const LOGICAL_W = {{ logical_w }}; // 서버가 보내는 좌표 기준
    const LOGICAL_H = {{ logical_h }};
    const stayDuration = 1500;   // ms: 버튼 안에서 머물러야 클릭

    // 버튼별 머무름 시작시간
    const lastStayTime = {};
    const targets = [...document.querySelectorAll('.target')];
    targets.forEach(btn => lastStayTime[btn.id] = performance.now());

    const area = document.getElementById("camera-area");
    const indicator = document.getElementById("indicator");

    // 진행도 업데이트 헬퍼
    function setProgress(el, active, ratio){
      el.dataset.active = active ? "true" : "false";
      el.style.setProperty('--p', Math.max(0, Math.min(1, ratio)));
    }

    // 좌표 스케일링 (논리 해상도 -> 실제 렌더 영역)
    function scaleToArea(x, y){
      const rect = area.getBoundingClientRect();
      const sX = rect.width / LOGICAL_W;
      const sY = rect.height / LOGICAL_H;
      return { x: x * sX, y: y * sY, rect };
    }

    // 폴링 (원하면 SSE로 바꿀 수 있음: /api/gaze/stream)
    async function fetchGaze(){
      const res = await fetch("/api/gaze").catch(()=>null);
      if(!res) return null;
      try { return await res.json(); } catch { return null; }
    }

    let lastPos = {x: LOGICAL_W/2, y: LOGICAL_H/2};

    async function loop(){
      const pos = await fetchGaze();
      if(pos && Number.isFinite(pos.x) && Number.isFinite(pos.y)){
        lastPos = pos;
      }

      const {x, y, rect} = scaleToArea(lastPos.x, lastPos.y);

      // 인디케이터 이동
      indicator.style.left = `${x}px`;
      indicator.style.top  = `${y}px`;

      // 버튼 hit test + 진행 링 렌더
      const now = performance.now();
      for(const btn of targets){
        const b = btn.getBoundingClientRect();

        // 히트 테스트는 "area 기준" 좌표 사용
        const hit = (x + rect.left >= b.left && x + rect.left <= b.right &&
                     y + rect.top  >= b.top  && y + rect.top  <= b.bottom);

        if(hit){
          const elapsed = now - lastStayTime[btn.id];
          const ratio = Math.min(1, elapsed / stayDuration);
          setProgress(btn, true, ratio);

          // dwell 완료 → 이동
          if(elapsed >= stayDuration){
            window.location.href = `/${btn.id.replace("btn","button")}`;
            // 다음 루프까지 대기
          }
        }else{
          lastStayTime[btn.id] = now;
          setProgress(btn, false, 0);
        }
      }

      requestAnimationFrame(loop);
    }

    // 초기 위치 및 진행 값 reset
    targets.forEach(t => setProgress(t, false, 0));
    loop();
  </script>
</body>
</html>
